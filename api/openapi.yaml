          maxLength: 4000
        retryable:
          type: boolean
        dependency_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Dependency record that resolves the error.
        operator_action:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
        correlation_id:
          $ref: '#/components/schemas/Identifier'
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
          description: Tenant the error belongs to, when known.
    EventEnvelope:
      x-plumb-contract: EventEnvelope
      type: object
      description: Domain event as published through the outbox (section 22).
