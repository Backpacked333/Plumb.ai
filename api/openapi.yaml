    OpportunityList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpportunitySpec'
        next_cursor:
          type: [string, 'null']
          maxLength: 512
    EventList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelope'
        next_cursor:
          type: [string, 'null']
          maxLength: 512
    OutcomeList:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutcomeObservation'
        next_cursor:
          type: [string, 'null']
          maxLength: 512
