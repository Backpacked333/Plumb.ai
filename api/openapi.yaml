          enum: [BASELINE_NATIVE_RULES, PROMPTED_GENERAL_MODEL, RETRIEVAL, SPECIALIST_API, TRAINED]
          description: The implementation options the model planner compares (PL-031).
        candidate_ref:
          oneOf:
            - $ref: '#/components/schemas/ArtifactRef'
            - type: 'null'
          description: Pinned artifact of the candidate (model version, workflow, ...).
        total_operating_cost:
          $ref: '#/components/schemas/Money'
        task_performance:
          $ref: '#/components/schemas/Metric'
        review_time_minutes:
          type: integer
          minimum: 0
        notes:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
    SegregationStatement:
      type: object
      description: Attestation that evaluation data was not used for tuning or repair (PL-044).
      required: [evaluation_data_disjoint_from_tuning, basis]
      additionalProperties: false
      properties:
        evaluation_data_disjoint_from_tuning:
          type: boolean
        basis:
          type: string
          minLength: 1
          maxLength: 4000
          description: How disjointness was established, e.g. by split content hashes.
    EvaluationReport:
      x-plumb-contract: EvaluationReport
      description: Held-out evaluation of one subject with denominators, severities, cost and trials.
      allOf:
        - $ref: '#/components/schemas/ArtifactHeader'
        - type: object
          required: [subject_ref, dataset_ref, held_out_split, level, case_count, metrics, error_severity_breakdown, review_time_minutes, cost_comparison, nondeterministic, trials, segregation_statement]
          properties:
            kind:
              const: EvaluationReport
            subject_ref:
              $ref: '#/components/schemas/ArtifactRef'
            dataset_ref:
              $ref: '#/components/schemas/ArtifactRef'
            held_out_split:
              type: string
              enum: [validation, test_temporal, test_client_disjoint]
            level:
              $ref: '#/components/schemas/VerificationLevel'
            case_count:
              type: integer
              minimum: 1
              description: Held-out cases the evaluation ran on.
            excluded_case_count:
              type: integer
              minimum: 0
              default: 0
              description: Eligible cases excluded from the run; part of the audit trail.
            exclusion_summary:
              type: [string, 'null']
              minLength: 1
              maxLength: 4000
              description: Why cases were excluded; required when excluded_case_count > 0.
            metrics:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Metric'
            error_severity_breakdown:
              $ref: '#/components/schemas/ErrorSeverityBreakdown'
            review_time_minutes:
              type: integer
              minimum: 0
              description: Human review time spent over the evaluated cases.
            cost_comparison:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CandidateComparison'
            nondeterministic:
              type: boolean
              description: Whether the subject's output varies between identical runs.
            trials:
              type: integer
              minimum: 1
              description: Independent runs over the held-out cases.
            segregation_statement:
              $ref: '#/components/schemas/SegregationStatement'
      unevaluatedProperties: false
    EvaluationRequest:
      type: object
      required: [subject_ref, dataset_ref, held_out_split, level, trials]
      additionalProperties: false
      properties:
        subject_ref:
          $ref: '#/components/schemas/ArtifactRef'
        dataset_ref:
          $ref: '#/components/schemas/ArtifactRef'
        held_out_split:
          type: string
          enum: [test_temporal, test_client_disjoint]
        level:
          $ref: '#/components/schemas/VerificationLevel'
        trials:
          type: integer
          minimum: 1
          maximum: 100
        comparison_candidates:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRef'
        budget:
          $ref: '#/components/schemas/Budget'

    ReleaseComponent:
      type: object
      description: Either a pinned artifact or an explicit reason for its absence (PL-046).
      additionalProperties: false
      properties:
        ref:
          oneOf:
            - $ref: '#/components/schemas/ArtifactRef'
            - type: 'null'
        omitted_reason:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
    MonitorKind:
      type: string
      enum: [CONNECTOR_FRESHNESS, SCHEMA_CHANGE, EXECUTION_FAILURE, QUALITY_DRIFT, REVIEW_BURDEN, COST, OUTCOME]
      description: The seven signals every active intervention is monitored on (PL-048).
    Monitor:
      type: object
      required: [kind, signal, threshold, action]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/MonitorKind'
        signal:
          type: string
          minLength: 1
          maxLength: 256
        threshold:
          type: string
          minLength: 1
          maxLength: 256
        action:
          type: string
          minLength: 1
          maxLength: 4000
    OperatingPlan:
      type: object
      description: Prospective operating plan of a release - one monitor per PL-048 signal, a human rollback owner and the outcome measurement (PL-043, PL-048).
      required: [monitors, rollback_owner, escalation_contact, outcome_measurement_ref, review_capacity_per_day]
      additionalProperties: false
      properties:
        monitors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Monitor'
        rollback_owner:
          $ref: '#/components/schemas/Principal'
        escalation_contact:
          type: string
          minLength: 1
          maxLength: 256
        outcome_measurement_ref:
          $ref: '#/components/schemas/NonSecretRef'
        review_capacity_per_day:
          type: integer
          minimum: 0
    RolloutStage:
      type: object
      required: [state, gate, environment, max_case_fraction]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [SHADOW, CANARY, ACTIVE]
        gate:
          type: string
          minLength: 1
          maxLength: 4000
        environment:
          type: string
          minLength: 1
          maxLength: 256
        max_case_fraction:
          type: number
          minimum: 0
          maximum: 1
    ReleaseManifest:
      x-plumb-contract: ReleaseManifest
      description: Binds every component version through immutable digests (PL-034, PL-046, PL-047).
      allOf:
        - $ref: '#/components/schemas/ArtifactHeader'
        - type: object
          required: [components, attestation_refs, rollout_policy, allowed_effect_classes, operating_plan]
          properties:
            kind:
              const: ReleaseManifest
            components:
              type: object
              description: |
                Keys include at least workflow, connector, collector, model, prompt,
                policy, schema, infrastructure and evaluation.
              additionalProperties:
                $ref: '#/components/schemas/ReleaseComponent'
            attestation_refs:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ArtifactRef'
            approval_refs:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactRef'
            rollout_policy:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RolloutStage'
            resolved_model_version:
              type: [string, 'null']
              maxLength: 256
              description: Immutable registry version; a mutable alias is rejected (PL-034).
            denominators:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
            allowed_effect_classes:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/EffectClass'
            review_thresholds:
              type: object
              additionalProperties:
                type: number
                minimum: 0
                maximum: 1
            in_flight_pinning:
              type: boolean
            scope:
              $ref: '#/components/schemas/ResourceScope'
            operating_plan:
              $ref: '#/components/schemas/OperatingPlan'
      unevaluatedProperties: false
    ReleaseStatus:
      type: object
      required: [release_id, tenant_id, manifest_ref, state, version, state_reason, updated_at]
      additionalProperties: false
      properties:
        release_id:
          $ref: '#/components/schemas/Identifier'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        manifest_ref:
          $ref: '#/components/schemas/ArtifactRef'
        state:
          $ref: '#/components/schemas/ReleaseState'
        version:
          type: integer
          minimum: 1
          description: Release row version; the `ETag` value (PL-056).
        resolved_model_version:
          type: [string, 'null']
          maxLength: 256
        previous_release_id:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        state_reason:
          type: string
          minLength: 1
          maxLength: 4000
        updated_at:
          type: string
          format: date-time
    ReleaseActivationRequest:
      type: object
      required: [target_stage, reason]
      additionalProperties: false
      properties:
        target_stage:
          type: string
          enum: [SHADOW, CANARY, ACTIVE]
        reason:
          type: string
          minLength: 1
          maxLength: 4000
        attestation_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRef'
        approval_refs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRef'
    ReleasePauseRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
        requested_by:
          $ref: '#/components/schemas/Principal'

    EffectSlot:
      type: object
      description: Semantic identity of a business action; independent of the release version (PL-039).
      required: [tenant_id, case_id, obligation_id, obligation_epoch, operation, target]
      additionalProperties: false
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        case_id:
          $ref: '#/components/schemas/Identifier'
        obligation_id:
          $ref: '#/components/schemas/Identifier'
        obligation_epoch:
          type: integer
          minimum: 0
        operation:
          $ref: '#/components/schemas/Identifier'
        target:
          $ref: '#/components/schemas/Identifier'
    ActionIntent:
      x-plumb-contract: ActionIntent
      description: Persisted before dispatch; the unit of deduplication (PL-037..PL-039).
      allOf:
        - $ref: '#/components/schemas/ArtifactHeader'
        - type: object
          required:
            - action_id
            - slot
            - payload_digest
            - expected_state_version
            - authority_ref
            - deployment_version
            - provider_target
            - effect_class
            - idempotency_key
          properties:
            kind:
              const: ActionIntent
            action_id:
              $ref: '#/components/schemas/Identifier'
            slot:
              $ref: '#/components/schemas/EffectSlot'
            payload_digest:
              $ref: '#/components/schemas/Sha256Digest'
            expected_state_version:
              type: integer
              minimum: 1
            authority_ref:
              $ref: '#/components/schemas/Identifier'
              description: Approval or envelope id authorizing the effect; an identifier, never a secret (PL-054).
            deployment_version:
              $ref: '#/components/schemas/Identifier'
            provider_target:
              $ref: '#/components/schemas/SourceRef'
            effect_class:
              $ref: '#/components/schemas/EffectClass'
            idempotency_key:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Hex SHA-256 of the logical action identity (action_id + slot), never derived from the payload (PL-039).
            supersedes_action_id:
              oneOf:
                - $ref: '#/components/schemas/Identifier'
                - type: 'null'
              description: Explicit supersession decision required to redispatch a slot with a changed payload (PL-037).
      unevaluatedProperties: false
    ActionReceipt:
      type: object
      description: Provider evidence of what happened (PL-038).
      required: [provider_request_id, observed_at, raw_receipt_digest]
      additionalProperties: false
      properties:
        provider_request_id:
          type: string
          minLength: 1
          maxLength: 256
        external_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        postcondition_probe:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
          description: Read-after-write observation that confirms the business state.
        observed_at:
          type: string
          format: date-time
        raw_receipt_digest:
          $ref: '#/components/schemas/Sha256Digest'
    ReconciliationRequest:
      type: object
      description: |
        Evidence used to leave `UNKNOWN` (PL-038). `CONFIRMED` requires a receipt;
        `FAILED_FINAL` requires provider-confirmed non-occurrence; otherwise the effect
        stays `UNKNOWN` and retry remains refused.
      required: [outcome, evidence, provider_confirmed_absent, reconciled_at]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [CONFIRMED, FAILED_FINAL, STILL_UNKNOWN]
        receipt:
          oneOf:
            - $ref: '#/components/schemas/ActionReceipt'
            - type: 'null'
        evidence:
          type: string
          minLength: 1
          maxLength: 4000
        provider_confirmed_absent:
          type: boolean
        reconciled_at:
          type: string
          format: date-time

    OutcomeObservation:
      type: object
      description: Per-case economics; technical and commercial success are recorded separately (PL-059).
      required: [observation_id, case_id, release_id, model_calls, completed, review_minutes, observed_at]
      additionalProperties: false
      properties:
        observation_id:
          $ref: '#/components/schemas/Identifier'
        case_id:
          $ref: '#/components/schemas/Identifier'
        release_id:
          $ref: '#/components/schemas/Identifier'
        model_calls:
          type: integer
          minimum: 0
        completed:
          type: boolean
        correct:
          type: [boolean, 'null']
          description: Whether the completed outcome was correct; `null` until the maturation window closes.
        realized_value:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        review_minutes:
          type: integer
          minimum: 0
        human_effort_category:
          oneOf:
            - $ref: '#/components/schemas/HumanEffortCategory'
            - type: 'null'
        observed_at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # List pages (PL-056)
