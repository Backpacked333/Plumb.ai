openapi: 3.1.0
info:
  title: Plumb Control-Plane API (proposed)
  version: 0.2.0
  summary: Proposed control-plane interface of the Plumb Autonomous Implementation System.
  description: |
    This document is a **proposed interface, not a running endpoint** (specification
    section 22). It covers envelope creation, inventory jobs, opportunity discovery,
    build creation/status/events, connection intents, collection jobs, dataset and
    training jobs, evaluations, release creation/activation/pause, action
    dispatch/reconciliation and outcome queries, and it defines the object schemas and
    the shared job/error envelopes.

    Conventions that apply to every operation:

    * **PL-004** — the `tenant_id` path segment is informational. Servers derive the
      tenant from verified authentication, never from the path or the body. A path
      tenant that differs from the authenticated tenant is answered with `404`, never
      with a `403` that would reveal that another tenant's resource exists (PL-056).
    * **PL-055** — long-running mutations return `202 Accepted` with a `JobEnvelope`
      carrying a durable job identity. Every mutating operation requires an
      `Idempotency-Key` header scoped to the tenant: the same key with the same payload
      returns the original operation; the same key with a different payload is
      rejected with `409` and `error_class: PAYLOAD_CONFLICT`. Server-assigned state is
      never overwritten by client claims.
    * **PL-056** — updates to versioned resources carry `If-Match` with the resource's
      current `ETag`; a stale version is answered with `412`. List operations use
      stable opaque cursors with a bounded page size (`limit` ≤ 200).
    * Errors never contain raw secrets, source content or another tenant's
      identifiers (section 22). Error responses use `ErrorEnvelope`.

    Schemas annotated with `x-plumb-contract` mirror the package contracts in
    `plumb/contracts` (JSON Schemas under `schemas/<ContractName>.json`) field for
    field: the same property set, the same required set and the same leaf constraints
    (`tests/test_openapi.py` asserts the parity for every annotated component). A
    server may add stricter API-level checks (for example requiring `kind` on every
    body) but the documented component never accepts what the contract rejects, nor
    rejects what the contract accepts. The `Idempotency-Key` header, `JobEnvelope.
    idempotency_key` and the `jobs` table share one limit of 255 characters. All
    `$ref`s are local to this document; reference validation (`api/validate_openapi.py`)
    checks JSON validity and local reference resolution only. Authentication,
    serialization compatibility and complete OpenAPI conformance need
    implementation-time tests. `x-plumb-result-contract` on a 202 operation names the
    contract its `JobEnvelope.result_ref` resolves to.
  license:
    name: Proprietary
servers:
  - url: https://control-plane.example.invalid
    description: Placeholder host. No deployed server exists for this proposal.
security:
  - bearerAuth: []
tags:
  - name: envelopes
    description: Autonomy envelopes (PL-005). Versioned; a new version supersedes the previous one.
  - name: inventory
    description: Environment inventory jobs (PL-007, PL-008).
  - name: opportunities
    description: Opportunity discovery and selection (PL-012, PL-013).
  - name: builds
    description: Build plans, build status, build events and dependency resolution (PL-014..PL-019).
  - name: connections
    description: Connection intents that mint provider consent sessions (section 10).
  - name: collection
    description: Collector construction jobs (PL-023..PL-025).
  - name: datasets
    description: Dataset materialisation jobs (PL-028..PL-030).
  - name: training
    description: Training jobs with persisted submission identity (PL-032, PL-033).
  - name: evaluation
    description: Held-out evaluations (PL-031, PL-034).
  - name: releases
    description: Release creation and rollout state (PL-046, PL-047).
  - name: actions
    description: External-effect dispatch and reconciliation (PL-037..PL-039).
  - name: outcomes
    description: Outcome observations and economics (PL-059).

paths:
  /v1/tenants/{tenant_id}/envelopes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createEnvelope
      tags: [envelopes]
      summary: Create or supersede an autonomy envelope
      description: |
        Stores a new `AutonomyEnvelope` version tied to an authenticated business owner
        (PL-005). Supersession and revocation are modelled by posting a new
        `envelope_version` for an existing `envelope_id` together with `If-Match` on the
        current version; a stale `If-Match` returns `412` (PL-056). A derived task can
        never widen the envelope. Tenant identity comes from authentication, not from the
        path or body (PL-004). The operation is synchronous (`201`) and idempotent under
        `Idempotency-Key`; the same key with a different payload returns `409
        PAYLOAD_CONFLICT` (PL-055).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomyEnvelope'
      responses:
        '201':
          description: Envelope version stored.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/tenants/{tenant_id}/envelopes/{envelope_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/EnvelopeId'
    get:
      operationId: getEnvelope
      tags: [envelopes]
      summary: Fetch the current version of an envelope
      description: |
        Returns the latest `AutonomyEnvelope` version with its `ETag`. The tenant is
        derived from authentication (PL-004); an envelope that belongs to another tenant
        is reported as `404`, never `403` (PL-056).
      responses:
        '200':
          description: Current envelope version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/inventory-jobs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: startInventoryJob
      tags: [inventory]
      summary: Start an environment inventory job
      description: |
        Starts the autonomous inventory of applications, accounts, entities, schema
        versions, operations, authorization status, quotas, update mechanisms, freshness
        and owners within the envelope's source scope (PL-007). Capability maturity is
        recorded per probe (PL-008). Long-running: returns `202` with a `JobEnvelope`
        whose `result_ref` resolves to an `EnvironmentInventory` artifact (PL-055). The
        tenant comes from authentication (PL-004).
      x-plumb-result-contract: EnvironmentInventory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryJobRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/inventory-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getInventoryJob
      tags: [inventory]
      summary: Fetch an inventory job and its inventory when complete
      description: |
        Returns the durable job status (PL-055) and, once the job succeeded, the
        `EnvironmentInventory` including its coverage report of unobserved applications
        and employees (PL-007). Cross-tenant job ids are `404` (PL-004, PL-056).
      responses:
        '200':
          description: Job status with optional inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/opportunity-discoveries:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: startOpportunityDiscovery
      tags: [opportunities]
      summary: Start opportunity discovery for a goal
      description: |
        Starts discovery of candidate interventions from the inventory and evidence
        (PL-012). Each produced `OpportunitySpec` carries baseline, evidence coverage,
        expected benefit range, failure and review cost and a prospective measurement
        plan (PL-013). Long-running: `202` with a `JobEnvelope` (PL-055); the tenant comes
        from authentication (PL-004).
      x-plumb-result-contract: OpportunitySpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityDiscoveryRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/opportunities:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List discovered opportunities
      description: |
        Lists `OpportunitySpec` artifacts of the authenticated tenant (PL-004) using a
        stable opaque cursor and a bounded page size (PL-056). `next_cursor` is `null`
        on the last page.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: goal_id
          in: query
          required: false
          description: Restrict to opportunities discovered for one goal.
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: One page of opportunities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/builds:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createBuild
      tags: [builds]
      summary: Submit a build plan and start the build
      description: |
        Validates the submitted `BuildPlan` with the reference checker (dependency DAG,
        capability maturity, envelope scope, purposes, budgets, verification obligations;
        PL-014..PL-019) and starts the build. Long-running: `202` with a `JobEnvelope`
        whose `job_id` is the build id (PL-055). A plan that fails validation is rejected
        with `400` and a `VERIFICATION_FAILED`, `SCOPE_DENIED`, `PURPOSE_DENIED`,
        `BUDGET_EXCEEDED` or `CAPABILITY_UNSUPPORTED` error class. The tenant is derived
        from authentication; a plan whose `tenant_id` differs is `404` (PL-004, PL-056).
      x-plumb-result-contract: BuildPlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildPlan'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/builds/{build_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BuildId'
    get:
      operationId: getBuild
      tags: [builds]
      summary: Fetch build status
      description: |
        Returns the build lifecycle state (section 23), per-step states and open
        dependencies. The `ETag` is the build version used by `resolveBuildDependency`
        (PL-056). Cross-tenant build ids are `404` (PL-004).
      responses:
        '200':
          description: Build status.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/builds/{build_id}/events:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BuildId'
    get:
      operationId: listBuildEvents
      tags: [builds]
      summary: List build events
      description: |
        Returns the build's `EventEnvelope`s in per-aggregate order (section 22).
        Ordering is guaranteed per aggregate only. Pagination uses a stable opaque
        cursor with `limit` ≤ 200 (PL-056). The tenant is derived from authentication
        (PL-004).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/builds/{build_id}/dependencies/{dependency_id}/resolution:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BuildId'
      - $ref: '#/components/parameters/DependencyId'
    post:
      operationId: resolveBuildDependency
      tags: [builds]
      summary: Supply a raised dependency and resume the build
      description: |
        Records the authorization, consent or business decision that a `dependency.raise`
        step asked for and resumes the blocked steps from persisted state (PL-001,
        PL-041). The supplied authority must come from an independently authenticated
        decision, never from the build agent (PL-040). `If-Match` carries the build
        version from `getBuild`; a stale version returns `412` (PL-056). Long-running:
        `202` with a `JobEnvelope` (PL-055); the same `Idempotency-Key` with a different
        payload returns `409 PAYLOAD_CONFLICT`. Tenant from authentication (PL-004).
      x-plumb-result-contract: ApprovalRecord
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyResolution'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/tenants/{tenant_id}/connection-intents:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createConnectionIntent
      tags: [connections]
      summary: Create a connection intent for a provider account
      description: |
        Mints a consent/authorization session for an application that is not yet
        accessible (section 5, section 10). The response carries a `consent_url_ref`
        (a reference, never a token) that the accountable human completes; Plumb never
        bypasses vendor approvals or MFA. Synchronous (`201`), idempotent under
        `Idempotency-Key` (PL-055). The granted scopes become source grants on the
        envelope only through an authenticated consent (PL-040). Tenant from
        authentication (PL-004).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionIntentRequest'
      responses:
        '201':
          description: Connection intent created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/connection-intents/{intent_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/IntentId'
    get:
      operationId: getConnectionIntent
      tags: [connections]
      summary: Fetch a connection intent
      description: |
        Returns the intent's consent state. Credentials obtained through consent are held
        by the gateway and are never returned (PL-006, PL-054). Cross-tenant ids are
        `404` (PL-004, PL-056).
      responses:
        '200':
          description: Connection intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/collection-jobs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: startCollectionJob
      tags: [collection]
      summary: Start building a collector from a CollectionSpec
      description: |
        Deploys the described collector in shadow mode, backfills from the agreed
        watermark, reconciles and enables incremental processing (PL-023, PL-024). The
        spec must carry evidence of permitted purpose for every source (PL-053). Collector
        health (freshness, lag, completeness, failure state) is published through
        `getCollectionJob` (PL-025). Long-running: `202` with a `JobEnvelope` (PL-055).
        Tenant from authentication (PL-004).
      x-plumb-result-contract: CollectionSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionSpec'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/collection-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getCollectionJob
      tags: [collection]
      summary: Fetch a collection job with collector state and health
      description: |
        Returns the job status, the collector lifecycle state (section 23) and the
        published health contract (PL-025). A stopped collector is reported as such so
        downstream workflows block or degrade explicitly. Cross-tenant ids are `404`
        (PL-004, PL-056).
      responses:
        '200':
          description: Collection job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/dataset-jobs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: startDatasetJob
      tags: [datasets]
      summary: Materialise a dataset revision from a proposed manifest
      description: |
        Accepts a proposed `DatasetManifest` (split rules, label definition, pinned source
        versions and transformations; `rows` may be empty) and materialises the rows
        with point-in-time correctness and split hygiene (PL-028, PL-029). The resulting
        manifest is immutable and reproducible from the pinned inputs (PL-030); when
        required source material was deleted the dataset is marked `UNAVAILABLE` rather
        than falsified. Long-running: `202` with a `JobEnvelope` (PL-055). Tenant from
        authentication (PL-004).
      x-plumb-result-contract: DatasetManifest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetManifest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/training-jobs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: startTrainingJob
      tags: [training]
      summary: Submit a training job from a TrainingSpec
      description: |
        Verifies that the provider supports the pinned base model, method and modality
        before any provider job is submitted (PL-032), persists the submission identity
        so a lost response cannot launch a duplicate job (PL-033) and reserves the
        declared budget (PL-058). TRAIN purpose must be granted for every source of the
        dataset; it is never inferred from read permission (PL-053). Long-running: `202`
        with a `JobEnvelope` (PL-055). Tenant from authentication (PL-004).
      x-plumb-result-contract: TrainingSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSpec'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/training-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getTrainingJob
      tags: [training]
      summary: Fetch a training job
      description: |
        Returns the job status, the training lifecycle state (section 23), the persisted
        submission identity (PL-033) and, when complete, the candidate model artifact. A
        completed provider job is a candidate, not an approved production model (PL-033,
        PL-034). Cross-tenant ids are `404` (PL-004, PL-056).
      responses:
        '200':
          description: Training job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant_id}/evaluations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createEvaluation
      tags: [evaluation]
      summary: Run a held-out evaluation
      description: |
        Evaluates a subject (model version, workflow or release candidate) on a pinned
        held-out dataset and produces an `EvaluationReport` with denominators, error
        severity breakdown, review time and a candidate cost comparison (PL-031, PL-034).
        Evaluation data is never used for tuning; the report carries a segregation
        statement. Long-running: `202` with a `JobEnvelope` whose `result_ref` resolves
        to the report (PL-055). Tenant from authentication (PL-004).
      x-plumb-result-contract: EvaluationReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/releases:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createRelease
      tags: [releases]
      summary: Create a release candidate from a ReleaseManifest
      description: |
        Stores a `ReleaseManifest` that binds workflow, connector, collector, model,
        prompt, policy, schema, infrastructure and evaluation versions through immutable
        digests (PL-046). The release is rejected with `400 VERIFICATION_FAILED` when any
        required attestation was produced for different bytes or a different scope. The
        mutable model alias must already be resolved to an immutable version (PL-034).
        Synchronous (`201`) in state `CANDIDATE`; idempotent under `Idempotency-Key`
        (PL-055). Tenant from authentication (PL-004).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseManifest'
      responses:
        '201':
          description: Release candidate created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/releases/{release_id}/activation:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      operationId: activateRelease
      tags: [releases]
      summary: Advance a release to the next rollout stage
      description: |
        Advances the release through `SHADOW`, `CANARY` and `ACTIVE` only when the stage
        gate passes; `ACTIVE` requires current authority and accepted attestations
        (section 23, PL-047). New cases use the resolved release version; in-flight cases
        stay pinned. `If-Match` carries the release `ETag`; a stale version returns `412`
        (PL-056). Long-running: `202` with a `JobEnvelope` (PL-055). The same
        `Idempotency-Key` with a different payload returns `409 PAYLOAD_CONFLICT`. Tenant
        from authentication (PL-004).
      x-plumb-result-contract: ReleaseManifest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseActivationRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/tenants/{tenant_id}/releases/{release_id}/pause:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      operationId: pauseRelease
      tags: [releases]
      summary: Pause a release
      description: |
        Moves the release to `PAUSED`, which blocks new external effects immediately while
        preserving visibility and recovery (PL-047). Pausing is a synchronous state
        transition (`200`) with a persisted reason (PL-057). `If-Match` carries the
        release `ETag`; a stale version returns `412` (PL-056). Idempotent under
        `Idempotency-Key` (PL-055). Tenant from authentication (PL-004).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleasePauseRequest'
      responses:
        '200':
          description: Release paused.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/tenants/{tenant_id}/actions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: dispatchAction
      tags: [actions]
      summary: Reserve and dispatch an external action
      description: |
        Persists the `ActionIntent` (stable effect slot, payload digest, expected state
        version, authority reference, deployment version and provider target) before any
        dispatch (PL-037). The same effect slot with the same payload digest returns the
        existing action; the same slot with a different payload returns `409
        PAYLOAD_CONFLICT` unless `supersedes_action_id` names a terminal action.
        Deduplication is independent of the release version (PL-039). An ambiguous
        provider outcome leaves the effect `UNKNOWN` (PL-038). Long-running: `202` with a
        `JobEnvelope` (PL-055). Tenant from authentication (PL-004).
      x-plumb-result-contract: ActionIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionIntent'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/actions/{action_id}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ActionId'
    post:
      operationId: reconcileAction
      tags: [actions]
      summary: Reconcile an UNKNOWN action against provider state
      description: |
        Looks up provider request ids, external ids and read-after-write probes to decide
        whether an `UNKNOWN` effect `CONFIRMED` or `FAILED_FINAL` (PL-038). A timeout is
        never treated as proof that nothing happened; retry is refused while the effect
        stays `UNKNOWN` (`409 EFFECT_UNKNOWN`). Long-running: `202` with a `JobEnvelope`
        (PL-055). Tenant from authentication (PL-004); cross-tenant action ids are `404`.
      x-plumb-result-contract: ActionIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayloadConflict'

  /v1/tenants/{tenant_id}/outcomes:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listOutcomes
      tags: [outcomes]
      summary: List outcome observations
      description: |
        Returns per-case outcome observations distinguishing model calls, completed
        cases, correct outcomes, realized business value and review effort by human
        effort category (PL-003, PL-059). Pagination uses a stable opaque cursor with
        `limit` ≤ 200 (PL-056). Tenant from authentication (PL-004).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: release_id
          in: query
          required: false
          description: Restrict to cases that ran under one release.
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: observed_after
          in: query
          required: false
          description: Only observations recorded at or after this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of outcome observations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC-issued bearer token. The tenant and acting principal are derived from the
        verified token (PL-004); nothing in the path or body can change them. Tokens are
        never echoed in responses, logs or error messages (PL-054).

  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: |
        Informational tenant segment. Servers derive the tenant from authentication
        (PL-004); a mismatch is answered with `404` (PL-056).
      schema:
        $ref: '#/components/schemas/TenantId'
    EnvelopeId:
      name: envelope_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    BuildId:
      name: build_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    DependencyId:
      name: dependency_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IntentId:
      name: intent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ActionId:
      name: action_id
      in: path
      required: true
      description: Logical action id, stable across retries of the same action (PL-037).
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Tenant-scoped idempotency key (PL-055). The same key with the same payload returns
        the original operation; the same key with a different payload returns `409` with
        `error_class: PAYLOAD_CONFLICT`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Current `ETag` of the versioned resource (PL-056). A stale value returns `412`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: |
        Required when superseding an existing `envelope_id`: the `ETag` of the current
        envelope version (PL-056). A stale value returns `412`. Omitted for a new
        `envelope_id`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor` (PL-056).
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size (PL-056).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  headers:
    ETag:
      description: Opaque version tag of the returned resource; echo it in `If-Match` (PL-056).
      schema:
        type: string
    Location:
      description: Tenant-relative URL of the created resource.
      schema:
        type: string

  responses:
    JobAccepted:
      description: Accepted; the job runs asynchronously with a durable identity (PL-055).
      headers:
        Location:
          $ref: '#/components/headers/Location'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobEnvelope'
    BadRequest:
      description: |
        Malformed request or a payload that fails local checks (schema validity, plan
        checker, dataset checker, release checker). `error_class` names the rule family.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials (`AUTH_REQUIRED`). Generic; carries no resource detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        The authenticated principal lacks the required scope or purpose within its own
        tenant (`SCOPE_DENIED`, `PURPOSE_DENIED`, `POLICY_STALE`). Generic; never used to
        signal that another tenant's resource exists (PL-056).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        No such resource in the authenticated tenant. Also returned, instead of `403`,
        when the path names another tenant or another tenant's resource (PL-004, PL-056).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadConflict:
      description: |
        The `Idempotency-Key` was already used with a different payload
        (`PAYLOAD_CONFLICT`, PL-055), the effect slot is already reserved with a different
        payload digest (PL-037), the aggregate is not in a state that allows the
        transition (`STATE_CONFLICT`), or the effect is still `UNKNOWN` (`EFFECT_UNKNOWN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: Stale `If-Match`; the resource version changed (`STATE_CONFLICT`, PL-056).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ------------------------------------------------------------------
    # Scalar types mirroring plumb.contracts.common
    # ------------------------------------------------------------------
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_.:/-]{0,159}$'
      description: Lower-case machine identifier.
    TenantId:
      type: string
      pattern: '^tnt_[a-z0-9]{4,32}$'
      description: Tenant identity; always derived from authentication (PL-004).
    Sha256Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    SemVer:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
    Region:
      type: string
      pattern: '^[a-z]{2,3}(-[a-z0-9]+)*$'
    NonSecretRef:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S+$'
      description: |
        Reference resolved by the gateway (e.g. `vault:ref/...`): one word, never a secret
        value. Servers apply the package's one secret heuristic
        (`plumb.contracts.common.reject_secret_like`, PL-054): the markers `secret`,
        `password`, `token=`, `token:`, `bearer `, `private key`, the shapes of an AWS
        access key id and a JWT, and long hexadecimal or base64 runs are rejected.
      not:
        pattern: '[sS][eE][cC][rR][eE][tT]|[pP][aA][sS][sS][wW][oO][rR][dD]|[tT][oO][kK][eE][nN][=:]|[bB][eE][aA][rR][eE][rR] |[pP][rR][iI][vV][aA][tT][eE] [kK][eE][yY]|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10,}\.'
    StorageRef:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[a-z][a-z0-9+.-]*:(//)?[A-Za-z0-9._~/:@-]+$'
      description: |
        Locator of stored bytes (`scheme:` or `scheme://` plus a URI-safe path). Content
        cannot pass as a locator: braces, quotes, commas, spaces and percent-escapes are
        not admitted, and the secret heuristic of `NonSecretRef` applies too (PL-009, PL-054).
    OperationId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9]{0,99}$'
      description: An operationId of this document (camelCase), e.g. `createBuild`.

    # ------------------------------------------------------------------
    # Closed vocabularies (exact values from plumb.contracts.common)
    # ------------------------------------------------------------------
    EffectClass:
      type: string
      enum:
        - READ
        - INTERNAL_WRITE
        - EXTERNAL_WRITE_REVERSIBLE
        - EXTERNAL_WRITE_IRREVERSIBLE
        - EXTERNAL_COMMUNICATION
        - FINANCIAL_COMMITMENT
        - INFRASTRUCTURE_CHANGE
        - DESTRUCTIVE
    DataPurpose:
      type: string
      enum: [INSPECT, COLLECT, TRANSFORM, EVALUATE, TRAIN, SERVE, EXPORT]
    PrincipalType:
      type: string
      enum:
        - HUMAN_OWNER
        - HUMAN_REVIEWER
        - HUMAN_APPROVER
        - SERVICE
        - BUILD_AGENT
        - RUNTIME_AGENT
        - VERIFIER
        - RELEASE_EXECUTOR
    HumanEffortCategory:
      type: string
      description: Categories of recorded human effort (PL-003).
      enum:
        - CUSTOMER_AUTHORIZATION
        - DOMAIN_CLARIFICATION
        - NORMAL_BUSINESS_REVIEW
        - ENGINEERING_INTERVENTION
        - OPERATIONAL_REPAIR
    ErrorClass:
      type: string
      description: Initial error classes of the control-plane protocol (section 22).
      enum:
        - AUTH_REQUIRED
        - SCOPE_DENIED
        - PURPOSE_DENIED
        - POLICY_STALE
        - STATE_CONFLICT
        - PAYLOAD_CONFLICT
        - BUDGET_EXCEEDED
        - CAPABILITY_UNSUPPORTED
        - SOURCE_STALE
        - DATA_QUALITY_FAILED
        - VERIFICATION_FAILED
        - EFFECT_UNKNOWN
        - RETRY_EXHAUSTED
    FailureClass:
      type: string
      enum:
        - TRANSIENT_INFRASTRUCTURE
        - IMPLEMENTATION_DEFECT
        - SOURCE_SCHEMA_CHANGE
        - MISSING_AUTHORIZATION
        - MISSING_BUSINESS_DECISION
        - UNSUPPORTED_CAPABILITY
        - POOR_MODEL_QUALITY
        - EXHAUSTED_RESOURCES
    CapabilityMaturity:
      type: string
      enum: [DISCOVERED, DOCUMENTED, SANDBOX_TESTED, PRODUCTION_VERIFIED]
    VerificationLevel:
      type: string
      enum: [SCHEMA_VALIDITY, ARTIFACT_INTEGRITY, INTEGRATION_BEHAVIOR, BUSINESS_OUTCOME, ECONOMIC_RESULT]
    LabelKind:
      type: string
      enum: [OBSERVED_OUTCOME, EXPERT_DECISION, CORRECTION, PREFERENCE, WEAK_PROXY]
    LabelStatus:
      type: string
      enum: [ACCEPTED, QUARANTINED_AMBIGUOUS, QUARANTINED_INCONSISTENT, QUARANTINED_DISPUTED, REJECTED]
    SplitName:
      type: string
      enum: [train, validation, test_temporal, test_client_disjoint]
    ArtifactKind:
      type: string
      enum:
        - AutonomyEnvelope
        - CapabilityRecord
        - EnvironmentInventory
        - EvidencePacket
        - OpportunitySpec
        - BuildPlan
        - IntegrationSpec
        - CollectionSpec
        - DatasetManifest
        - TrainingSpec
        - WorkflowSpec
        - EvaluationReport
        - InfrastructurePlan
        - ReleaseManifest
        - ActionIntent
        - ApprovalRecord
        - VerificationAttestation
        - AdapterCode
        - AdapterConfiguration
        - TransformationCode
        - TestBundle
        - ProbeReceipt
        - VerificationReceipt
        - QualityReport
        - LabelAuditReport
        - SourceCandidateTable
        - TaskDefinition
        - ModelVersion
        - ServingConfiguration
        - CandidateComparison
        - InfrastructurePreview
        - CanaryReport
        - DependencyRecord
        - ReviewPackage
    BuildState:
      type: string
      description: Build lifecycle (section 23).
      enum: [DRAFT, VALIDATED, RUNNING, WAITING_AUTH, WAITING_INPUT, VERIFYING, VERIFIED, FAILED, CANCELLED]
    BuildStepState:
      type: string
      description: Build step lifecycle (section 23).
      enum: [PENDING, READY, RUNNING, VERIFYING, VERIFIED, FAILED, BLOCKED, CANCELLED]
    CollectorState:
      type: string
      description: Collector lifecycle (section 23).
      enum: [PLANNED, SHADOW, BACKFILLING, RECONCILING, ACTIVE, DEGRADED, PAUSED, RETIRED]
    DatasetState:
      type: string
      description: Dataset lifecycle (section 23).
      enum: [PROPOSED, MATERIALIZING, QUARANTINED, VERIFIED, SUPERSEDED, UNAVAILABLE]
    TrainingState:
      type: string
      description: Training lifecycle (section 23).
      enum: [PLANNED, SUBMITTED, RUNNING, CANDIDATE, FAILED, CANCELLED]
    ReleaseState:
      type: string
      description: Release lifecycle (section 23, PL-047).
      enum: [CANDIDATE, VERIFIED, SHADOW, CANARY, ACTIVE, PAUSED, ROLLED_BACK, RETIRED]
    EffectState:
      type: string
      description: Effect lifecycle (section 23, PL-038).
      enum: [RESERVED, DISPATCHED, UNKNOWN, CONFIRMED, FAILED_FINAL, COMPENSATED]
    JobStatus:
      type: string
      description: Durable job status (PL-055). Server-assigned; never taken from a client.
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, WAITING]

    # ------------------------------------------------------------------
    # Shared value objects
    # ------------------------------------------------------------------
    Money:
      type: object
      description: Integer minor units plus an ISO 4217 currency; never floats (section 10).
      required: [minor_units, currency]
      additionalProperties: false
      properties:
        minor_units:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Budget:
      type: object
      description: Worst-case reservation for a unit of work (PL-014, PL-018, PL-058).
      required: [spend, max_attempts, max_elapsed_seconds]
      additionalProperties: false
      properties:
        spend:
          $ref: '#/components/schemas/Money'
        max_attempts:
          type: integer
          minimum: 1
          maximum: 1000
        max_elapsed_seconds:
          type: integer
          minimum: 1
        max_model_calls:
          type: [integer, 'null']
          minimum: 0
    Principal:
      type: object
      description: An authenticated acting principal.
      required: [principal_id, principal_type, authenticated_via]
      additionalProperties: false
      properties:
        principal_id:
          $ref: '#/components/schemas/Identifier'
        principal_type:
          $ref: '#/components/schemas/PrincipalType'
        authenticated_via:
          $ref: '#/components/schemas/NonSecretRef'
          description: Authentication mechanism reference (e.g. `oidc:issuer`), never a secret (PL-054).
    ResourceScope:
      type: object
      description: Sources, destinations, processors and regions an operation may touch.
      additionalProperties: false
      properties:
        source_ids:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        destination_ids:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        processor_ids:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
    SourceRef:
      type: object
      description: Reference to an authorized external source/account. Never carries credentials.
      required: [source_id, provider, external_account_id]
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Identifier'
        provider:
          type: string
          minLength: 1
          maxLength: 256
        external_account_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Provider-assigned account identity (opaque, non-secret).
        resource:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
    ArtifactRef:
      type: object
      description: Immutable reference to a stored artifact by digest (section 8).
      required: [artifact_id, kind, digest]
      additionalProperties: false
      properties:
        artifact_id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        digest:
          $ref: '#/components/schemas/Sha256Digest'
        schema_version:
          $ref: '#/components/schemas/SemVer'
    ArtifactHeader:
      type: object
      description: |
        Fields every stored artifact carries (section 8). `content_digest` is assigned by
        the artifact store; a client-supplied value is ignored (PL-055). `kind` defaults
        to the contract's pinned value, as in the Pydantic models; each annotated component
        constrains it with `const`.
      required: [artifact_id, tenant_id, version, producer, created_at]
      properties:
        artifact_id:
          $ref: '#/components/schemas/Identifier'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        schema_version:
          $ref: '#/components/schemas/SemVer'
        version:
          type: integer
          minimum: 1
          description: Immutable version number of this artifact id.
        content_digest:
          oneOf:
            - $ref: '#/components/schemas/Sha256Digest'
            - type: 'null'
        producer:
          $ref: '#/components/schemas/Principal'
        created_at:
          type: string
          format: date-time
        evidence_links:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
    DependencyRecord:
      type: object
      description: A precise, resumable external dependency (PL-001, Appendix A `dependency.raise`).
      required: [dependency_id, failure_class, error_class, description, resolver_role, raised_at]
      additionalProperties: false
      properties:
        dependency_id:
          $ref: '#/components/schemas/Identifier'
        failure_class:
          $ref: '#/components/schemas/FailureClass'
        error_class:
          $ref: '#/components/schemas/ErrorClass'
        description:
          type: string
          minLength: 1
          maxLength: 4000
        missing_authority:
          type: array
          description: Exact grants, consents or decisions required; names, never credential values (PL-054).
          items:
            type: string
            minLength: 1
            maxLength: 256
        resolver_role:
          $ref: '#/components/schemas/PrincipalType'
        blocked_step_ids:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        resumes_after:
          type: [string, 'null']
          minLength: 1
          maxLength: 4000
        raised_at:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Supporting envelopes (section 22)
    # ------------------------------------------------------------------
    JobEnvelope:
      x-plumb-contract: JobEnvelope
      type: object
      description: Durable status of a long-running mutation (PL-055).
      required: [job_id, tenant_id, status, idempotency_key, operation, created_at, updated_at, server_assigned_version]
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Identifier'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        status:
          $ref: '#/components/schemas/JobStatus'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: Client key, scoped to the tenant by the server; the same 255-character limit as the Idempotency-Key header (PL-055).
        operation:
          $ref: '#/components/schemas/OperationId'
          description: OpenAPI operationId that started the job, e.g. `createBuild`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_ref:
          oneOf:
            - $ref: '#/components/schemas/ArtifactRef'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - type: 'null'
        server_assigned_version:
          type: integer
          minimum: 1
          description: Set only by the server; client values are ignored.
        request_payload_digest:
          oneOf:
            - $ref: '#/components/schemas/Sha256Digest'
            - type: 'null'
          description: Digest of the original request so a repeated key with another payload conflicts.
    ErrorEnvelope:
      x-plumb-contract: ErrorEnvelope
      type: object
      description: |
        Shared error shape of every control-plane response (section 22). Neither `message`
        nor `operator_action` may carry a secret-looking value or another tenant's
        identifier; servers apply the same heuristic as `NonSecretRef` to both texts.
      required: [error_class, message, retryable, correlation_id]
      additionalProperties: false
      properties:
        error_class:
