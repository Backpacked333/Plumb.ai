          $ref: '#/components/schemas/CapabilityMaturity'
        probe_receipt_ref:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: Receipt of the successful probe that established the maturity.
        last_probed_at:
          type: [string, 'null']
          format: date-time
        account_id:
          type: string
          minLength: 1
          maxLength: 256
          description: 'Account the capability was established for: a source_id or external_account_id of the owning application''s accounts.'
    ApplicationRecord:
      type: object
      description: One application observed during inventory (PL-007).
      required: [application_id, name, authorization_status, update_mechanism]
      additionalProperties: false
      properties:
        application_id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 256
        accounts:
